name: Deploy APIM example

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "先运行 plan 检查，再运行 apply 部署"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      import_existing_api_policy:
        description: "Apply 时将已存在但尚未纳入 state 的 API policy 导入"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-apim-example
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: azure-demo
    defaults:
      run:
        shell: bash
        working-directory: quickstart/101-azure-api-management-create-with-api
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      ARM_USE_OIDC: "true"
      ARM_USE_CLI: "false"
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
      TF_VAR_open_api_spec_content_format: "openapi+json-link"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.13.5"
          terraform_wrapper: false

      - name: Check configuration and enable remote backend
        run: |
          for name in TF_STATE_STORAGE_ACCOUNT TF_STATE_CONTAINER; do
            value="${!name}"
            value="${value//$'\r'/}"
            value="${value//$'\n'/}"
            printf -v "$name" '%s' "$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
          for name in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID TF_STATE_STORAGE_ACCOUNT TF_STATE_CONTAINER ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing configuration: ${name}"
              exit 1
            fi
          done
          cp backend.tf.example backend.tf

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=apim-create-with-api.tfstate"

      - name: Terraform validate
        run: terraform validate

      - name: Import existing API policy
        if: ${{ inputs.operation == 'apply' && inputs.import_existing_api_policy }}
        run: |
          if terraform state list | grep -Fxq azurerm_api_management_api_policy.policy; then
            echo "API policy is already managed by Terraform."
            exit 0
          fi

          api_id="$(terraform show -json | jq -er '
            .values.root_module.resources[]
            | select(.address == "azurerm_api_management_api.api")
            | .values.id
            | sub(";rev=[^;]+$"; "")
          ')"
          terraform import azurerm_api_management_api_policy.policy "$api_id"

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: ${{ inputs.operation == 'apply' }}
        run: terraform apply tfplan
